# Build the Windows portable zip with Wails v3 and publish a GitHub Release.
#
# Triggers:
#   - push tag v*  (e.g. git tag v0.2.0 && git push origin v0.2.0)
#   - workflow_dispatch (manual; optional version)
#
# Artifacts per release:
#   - yt-feed-<ver>-win.zip

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver without v (e.g. 0.2.0). Empty = build/config.yml version.'
        required: false
        type: string
      prerelease:
        description: 'Mark GitHub release as prerelease'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      zip: ${{ steps.meta.outputs.zip }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install wails3
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          wails3 version

      - name: Resolve version / tag
        id: meta
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          elif [[ -n "${INPUT_VERSION:-}" ]]; then
            VER="${INPUT_VERSION#v}"
          else
            VER="$(grep -E '^\s*version:' build/config.yml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')"
          fi
          if [[ ! "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].+)?$ ]]; then
            echo "Invalid version: $VER" >&2
            exit 1
          fi
          TAG="v$VER"
          ZIP="yt-feed-${VER}-win.zip"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG ($ZIP)"

      - name: Sync version into package files
        shell: bash
        env:
          VER: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const ver = process.env.VER;
          const pkg = JSON.parse(fs.readFileSync('frontend/package.json', 'utf8'));
          pkg.version = ver;
          fs.writeFileSync('frontend/package.json', JSON.stringify(pkg, null, 2) + '\n');
          let cfg = fs.readFileSync('build/config.yml', 'utf8');
          cfg = cfg.replace(/version:\s*"[^"]+"/, `version: "${ver}"`);
          fs.writeFileSync('build/config.yml', cfg);
          console.log('version set to', ver);
          NODE

      - name: Install frontend deps
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Build Windows binary
        shell: pwsh
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: |
          $ErrorActionPreference = 'Stop'
          wails3 build
          if ($LASTEXITCODE -ne 0) { throw 'wails3 build failed' }
          if (-not (Test-Path 'bin\yt-feed.exe')) {
            Get-ChildItem bin -ErrorAction SilentlyContinue | Select-Object FullName
            throw 'bin\yt-feed.exe missing'
          }

      - name: Package zip
        shell: pwsh
        env:
          VER: ${{ steps.meta.outputs.version }}
          ZIP: ${{ steps.meta.outputs.zip }}
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PATH = "$env:SystemRoot\System32;$env:PATH"
          New-Item -ItemType Directory -Force -Path dist\publish | Out-Null
          $stage = Join-Path $env:RUNNER_TEMP 'yt-feed-stage'
          Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item bin\yt-feed.exe $stage\yt-feed.exe
          $zipPath = Join-Path (Resolve-Path dist\publish) $env:ZIP
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zipPath
          Write-Host "zip OK: $env:ZIP ($([math]::Round((Get-Item $zipPath).Length / 1MB, 1)) MB)"

      - uses: actions/upload-artifact@v4
        with:
          name: yt-feed-windows
          path: dist/publish/${{ steps.meta.outputs.zip }}
          if-no-files-found: error
          retention-days: 14

      - name: Create / update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VER: ${{ steps.meta.outputs.version }}
          ZIP: ${{ steps.meta.outputs.zip }}
          PRERELEASE: ${{ inputs.prerelease || false }}
        shell: bash
        run: |
          set -euo pipefail
          ARGS=(--title "YT Feed v${VER}" --notes "Windows portable build of YT Feed ${VER}.

          Download \`${ZIP}\`, extract, and run \`yt-feed.exe\` (WebView2 required on Windows 10).

          Proxy: Off / System / Custom — configure in the sidebar.")
          if [[ "${PRERELEASE}" == "true" ]]; then
            ARGS+=(--prerelease)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/publish/${ZIP}" --clobber
            echo "Updated existing release $TAG"
          else
            if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
              gh release create "$TAG" "dist/publish/${ZIP}" "${ARGS[@]}"
            else
              gh release create "$TAG" "dist/publish/${ZIP}" "${ARGS[@]}" --target "$GITHUB_SHA"
            fi
            echo "Created release $TAG"
          fi
